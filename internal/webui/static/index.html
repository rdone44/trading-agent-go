<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trading-agent 交易研究台</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <span class="mark">ta</span>
      <div>
        <strong>trading-agent</strong>
        <small id="config-source">本地配置</small>
      </div>
      <button type="button" id="quit-button" class="quit" title="关闭服务并退出" hidden>退出</button>
    </div>

    <form id="run-form" autocomplete="off">
      <fieldset>
        <legend>标的与数据</legend>
        <label class="field">
          <span>交易对</span>
          <input name="symbol" value="BTCUSDT" spellcheck="false">
        </label>
        <p class="hint">Binance 现货交易对，例如 <code>BTCUSDT</code>（也接受 <code>btc-usdt</code>）</p>
        <label class="field">
          <span>历史区间</span>
          <div class="inline">
            <input name="days" type="number" min="30" max="5000" step="1" value="730">
            <span class="unit">天</span>
          </div>
        </label>
      </fieldset>

      <fieldset>
        <legend>策略</legend>
        <label class="field">
          <span>模型</span>
          <select name="strategy" id="strategy-select"></select>
        </label>
        <p class="hint" id="strategy-description"></p>
        <div id="strategy-params" class="params"></div>
      </fieldset>

      <fieldset>
        <legend>风控与成本</legend>
        <label class="field">
          <span>初始资金</span>
          <!-- step must divide the default from min, or the browser rejects the value -->
          <input name="initial_cash" type="number" min="100" step="100" value="100000">
        </label>
        <div class="grid2">
          <label class="field">
            <span>最大仓位</span>
            <div class="inline"><input name="max_position_pct" type="number" min="1" max="100" step="1" value="95"><span class="unit">%</span></div>
          </label>
          <label class="field">
            <span>单笔风险</span>
            <div class="inline"><input name="max_risk_per_trade_pct" type="number" min="0" max="100" step="0.5" value="2"><span class="unit">%</span></div>
          </label>
          <label class="field">
            <span>止损</span>
            <div class="inline"><input name="stop_loss_pct" type="number" min="0" max="90" step="0.5" value="6"><span class="unit">%</span></div>
          </label>
          <label class="field">
            <span>止盈</span>
            <div class="inline"><input name="take_profit_pct" type="number" min="0" max="500" step="1" value="18"><span class="unit">%</span></div>
          </label>
          <label class="field">
            <span>最大回撤</span>
            <div class="inline"><input name="max_drawdown_pct" type="number" min="0" max="99" step="1" value="25"><span class="unit">%</span></div>
          </label>
          <label class="field">
            <span>单日亏损上限</span>
            <div class="inline"><input name="max_daily_loss_pct" type="number" min="0" max="99" step="0.5" value="5"><span class="unit">%</span></div>
          </label>
          <label class="field">
            <span>手续费</span>
            <div class="inline"><input name="commission_bps" type="number" min="0" max="100" step="0.1" value="1"><span class="unit">bp</span></div>
          </label>
          <label class="field">
            <span>滑点</span>
            <div class="inline"><input name="slippage_bps" type="number" min="0" max="200" step="0.5" value="5"><span class="unit">bp</span></div>
          </label>
        </div>
        <label class="check">
          <input name="allow_short" type="checkbox">
          <span>允许做空</span>
        </label>
      </fieldset>

      <button type="submit" id="run-button">开始回测</button>
      <div class="inline-actions">
        <button type="button" id="tune-button" class="ghost">LLM 调参</button>
        <label class="check inline">
          <input name="review" type="checkbox">
          <span>LLM 复盘</span>
        </label>
      </div>
      <p class="status" id="status" hidden></p>
    </form>
  </aside>

  <main class="main">
    <section class="panel" id="empty-state">
      <h1>回测工作台</h1>
      <p class="lede">
        在左侧选好标的、策略和风控参数，点击「开始回测」。引擎会加载行情、
        生成目标仓位、按风控规则计算每笔头寸大小，再通过模拟撮合成交，
        最后把结果汇总在这里。
      </p>
      <div class="empty-grid">
        <div>
          <h3>无未来函数</h3>
          <p>信号在收盘时确定，下一根开盘价成交。</p>
        </div>
        <div>
          <h3>计入交易摩擦</h3>
          <p>包含手续费、滑点、最小变动单位和最小下单金额。</p>
        </div>
        <div>
          <h3>风控优先</h3>
          <p>固定比例仓位、保护性止损，以及回撤熔断开关。</p>
        </div>
      </div>
    </section>

    <section class="panel" id="results" hidden>
      <header class="results-head">
        <div>
          <h1 id="result-title">—</h1>
          <p class="sub" id="result-sub"></p>
        </div>
        <div class="actions">
          <a id="report-link" class="button ghost" href="#" target="_blank" rel="noopener">打开完整报告</a>
        </div>
      </header>

      <div class="cards" id="cards"></div>

      <div class="charts">
        <figure>
          <figcaption>资金曲线 <span id="equity-range" class="muted"></span></figcaption>
          <div id="equity-chart" class="chart"></div>
        </figure>
        <figure>
          <figcaption>回撤</figcaption>
          <div id="drawdown-chart" class="chart short"></div>
        </figure>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="trades">成交明细 <span class="count" id="trades-count">0</span></button>
        <button class="tab" data-tab="orders">委托流水 <span class="count" id="orders-count">0</span></button>
        <button class="tab" data-tab="risk">风控事件 <span class="count" id="risk-count">0</span></button>
        <button class="tab" data-tab="metrics">全部指标</button>
      </div>
      <div id="tab-body"></div>

      <section id="review-panel" class="review-panel" hidden>
        <h2>LLM 复盘</h2>
        <p id="review-text" class="review-text"></p>
      </section>
    </section>

    <section class="panel" id="tune-results" hidden>
      <header class="results-head">
        <div>
          <h1>LLM 调参</h1>
          <p class="sub" id="tune-sub"></p>
        </div>
      </header>
      <div class="cards" id="tune-cards"></div>
      <div id="tune-rounds" class="tune-rounds"></div>
      <p class="muted" id="tune-note" hidden></p>
    </section>

    <section class="panel">
      <header class="results-head">
        <h2>历史回测</h2>
        <button class="button ghost small" id="refresh-runs">刷新</button>
      </header>
      <div id="runs-list" class="runs"></div>
    </section>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
